<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MASRI Studio - ستوديو مصر للصوتيات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
              display: ['Tajawal', 'sans-serif'],
            },
            colors: {
              primary: 'var(--bg-primary)',
              surface: 'var(--bg-surface)',
              highlight: 'var(--bg-highlight)',
              border: 'var(--border-color)',
              txt: {
                  primary: 'var(--text-primary)',
                  secondary: 'var(--text-secondary)',
                  muted: 'var(--text-muted)'
              },
              accent: {
                  DEFAULT: 'var(--color-accent)',
                  dim: 'var(--color-accent-dim)',
                  glow: 'var(--color-accent-glow)'
              },
              glass: 'var(--glass-bg)',
              'glass-border': 'var(--glass-border)',
            },
            animation: {
              'float': 'float 3s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'slide-up': 'slideUp 0.5s ease-out',
              'slide-down': 'slideDown 0.3s ease-out',
              'fade-in': 'fadeIn 0.4s ease-out',
              'scale-in': 'scaleIn 0.3s ease-out',
              'bounce-in': 'bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)',
              'shimmer': 'shimmer 2s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                '0%': { boxShadow: '0 0 5px var(--color-accent), 0 0 10px var(--color-accent)' },
                '100%': { boxShadow: '0 0 20px var(--color-accent), 0 0 40px var(--color-accent)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              bounceIn: {
                '0%': { transform: 'scale(0.3)', opacity: '0' },
                '50%': { transform: 'scale(1.05)' },
                '70%': { transform: 'scale(0.9)' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-primary: #0a0a0f;
        --bg-surface: #12121a;
        --bg-highlight: rgba(255, 255, 255, 0.03);
        --border-color: rgba(255, 255, 255, 0.08);
        
        --text-primary: #ffffff;
        --text-secondary: #a1a1aa;
        --text-muted: #52525b;

        --color-accent: #8b5cf6;
        --color-accent-dim: #6d28d9;
        --color-accent-glow: rgba(139, 92, 246, 0.15);

        --glass-bg: rgba(18, 18, 26, 0.8);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      .light-mode {
        --bg-primary: #fafafa;
        --bg-surface: #ffffff;
        --bg-highlight: rgba(139, 92, 246, 0.05);
        --border-color: rgba(139, 92, 246, 0.15);

        --text-primary: #18181b;
        --text-secondary: #52525b;
        --text-muted: #a1a1aa;

        --color-accent: #7c3aed;
        --color-accent-dim: #6d28d9;
        --color-accent-glow: rgba(139, 92, 246, 0.1);

        --glass-bg: rgba(255, 255, 255, 0.9);
        --glass-border: rgba(139, 92, 246, 0.2);
      }

      body {
        font-family: 'Cairo', sans-serif !important;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
          radial-gradient(ellipse at top right, var(--color-accent-glow) 0%, transparent 50%),
          radial-gradient(ellipse at bottom left, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        pointer-events: none;
        z-index: -1;
      }

      .font-display {
        font-family: 'Tajawal', sans-serif;
      }

      /* 3D Icon Effects */
      .icon-3d {
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)) drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        transform: perspective(500px) rotateX(5deg);
        transition: all 0.3s ease;
      }
      .icon-3d:hover {
        transform: perspective(500px) rotateX(0deg) scale(1.1);
        filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)) drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      }

      /* Glassmorphism */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
      }

      .glass-card {
        background: linear-gradient(135deg, var(--glass-bg), rgba(139, 92, 246, 0.03));
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 1.5rem;
      }

      /* 3D Button Effect */
      .btn-3d {
        position: relative;
        transform: translateY(0);
        transition: all 0.2s ease;
        box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.2);
      }
      .btn-3d:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.2);
      }
      .btn-3d:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 12px 30px rgba(0,0,0,0.3);
      }

      /* Neon glow */
      .neon-border {
        box-shadow: 0 0 5px var(--color-accent), 0 0 10px var(--color-accent-glow), inset 0 0 5px var(--color-accent-glow);
      }

      .text-gradient {
        background: linear-gradient(135deg, var(--color-accent), #06b6d4, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-primary); }
      ::-webkit-scrollbar-thumb { background: var(--color-accent-dim); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-accent); }

      /* Shimmer loading */
      .shimmer {
        background: linear-gradient(90deg, transparent, rgba(139,92,246,0.1), transparent);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }

      /* Animations */
      @keyframes bounce-in-anim {
        0% { transform: translate(-50%, -100%); opacity: 0; }
        60% { transform: translate(-50%, 10%); opacity: 1; }
        100% { transform: translate(-50%, 0); }
      }
      .animate-bounce-in-custom {
        animation: bounce-in-anim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",

}
</script>
</head>

    <div id="root"></div>
