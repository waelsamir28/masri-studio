<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MASRI Studio - ستوديو مصر</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Premium AI Voice Generator" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['IBM Plex Sans Arabic', 'sans-serif'],
              display: ['IBM Plex Sans Arabic', 'sans-serif'],
            },
            colors: {
              primary: 'var(--bg-primary)',
              surface: 'var(--bg-surface)',
              surface2: 'var(--bg-surface2)',
              highlight: 'var(--bg-highlight)',
              border: 'var(--border-color)',
              txt: {
                  primary: 'var(--text-primary)',
                  secondary: 'var(--text-secondary)',
                  muted: 'var(--text-muted)'
              },
              accent: {
                  DEFAULT: 'var(--color-accent)',
                  dim: 'var(--color-accent-dim)',
                  soft: 'var(--color-accent-soft)',
                  glow: 'var(--color-accent-glow)'
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
              'scale-in': 'scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)',
              'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
              'float': 'float 3s ease-in-out infinite',
              'wave': 'wave 4s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(12px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              scaleIn: { '0%': { transform: 'scale(0.92)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              pulseSoft: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.7' } },
              float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-6px)' } },
              wave: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-3px)' } },
            }
          }
        }
      }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      /* ============ THEMES ============ */
      /* Ocean Deep (Default) */
      :root {
        --bg-primary: #0a1628;
        --bg-surface: #0f2035;
        --bg-surface2: #152d47;
        --bg-highlight: #1a3a5c;
        --border-color: #1e4060;
        
        --text-primary: #e0f2fe;
        --text-secondary: #7dd3fc;
        --text-muted: #3b82a8;

        --color-accent: #06b6d4;
        --color-accent-dim: #0891b2;
        --color-accent-soft: rgba(6, 182, 212, 0.12);
        --color-accent-glow: rgba(6, 182, 212, 0.15);
      }

      .theme-warm {
        --bg-primary: #1c0f0a;
        --bg-surface: #2d1810;
        --bg-surface2: #3d2218;
        --bg-highlight: #4d2d20;
        --border-color: #5c3828;
        
        --text-primary: #fef3c7;
        --text-secondary: #fcd34d;
        --text-muted: #92681a;

        --color-accent: #f59e0b;
        --color-accent-dim: #d97706;
        --color-accent-soft: rgba(245, 158, 11, 0.12);
        --color-accent-glow: rgba(245, 158, 11, 0.15);
      }

      .theme-forest {
        --bg-primary: #0a1f10;
        --bg-surface: #0f2d18;
        --bg-surface2: #183d22;
        --bg-highlight: #204d2d;
        --border-color: #285c38;
        
        --text-primary: #d1fae5;
        --text-secondary: #6ee7b7;
        --text-muted: #1a9248;

        --color-accent: #10b981;
        --color-accent-dim: #059669;
        --color-accent-soft: rgba(16, 185, 129, 0.12);
        --color-accent-glow: rgba(16, 185, 129, 0.15);
      }

      .theme-neon {
        --bg-primary: #0a0a1a;
        --bg-surface: #12122a;
        --bg-surface2: #1a1a3a;
        --bg-highlight: #252550;
        --border-color: #303060;
        
        --text-primary: #f0f0ff;
        --text-secondary: #c4b5fd;
        --text-muted: #6b5ce7;

        --color-accent: #a855f7;
        --color-accent-dim: #9333ea;
        --color-accent-soft: rgba(168, 85, 247, 0.12);
        --color-accent-glow: rgba(168, 85, 247, 0.2);
      }

      body {
        font-family: 'IBM Plex Sans Arabic', sans-serif !important;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
        min-height: 100vh;
      }
      
      /* Animated background */
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
          radial-gradient(ellipse at 20% 50%, var(--color-accent-glow) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
      }

      /* ============ 3D COLORFUL ICONS ============ */
      .icon-3d-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-cyan { background: linear-gradient(135deg, #06b6d4, #0e7490); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(6,182,212,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-purple { background: linear-gradient(135deg, #a855f7, #7e22ce); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(168,85,247,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-pink { background: linear-gradient(135deg, #ec4899, #be185d); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(236,72,153,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-orange { background: linear-gradient(135deg, #f97316, #c2410c); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(249,115,22,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-green { background: linear-gradient(135deg, #10b981, #047857); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(16,185,129,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-red { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(239,68,68,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-yellow { background: linear-gradient(135deg, #eab308, #a16207); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(234,179,8,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
      .icon-3d-teal { background: linear-gradient(135deg, #14b8a6, #0f766e); color: white; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(20,184,166,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }

      .icon-3d { transform: perspective(200px) rotateX(5deg); transition: all 0.2s ease; }
      .icon-3d:hover { transform: perspective(200px) rotateX(0deg) scale(1.1); }

      /* ============ BUTTONS ============ */
      .btn-primary {
        background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dim));
        color: white;
        border-radius: 0.875rem;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.1) inset;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      .btn-primary::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
        pointer-events: none;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.15) inset;
      }
      .btn-primary:active { transform: translateY(0); }

      .btn-secondary {
        background: var(--bg-surface2);
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
        border-radius: 0.875rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }
      .btn-secondary:hover {
        background: var(--bg-highlight);
        color: var(--text-primary);
        border-color: var(--color-accent);
      }

      .btn-ghost {
        color: var(--text-muted);
        transition: all 0.15s ease;
      }
      .btn-ghost:hover { color: var(--color-accent); background: var(--color-accent-soft); }

      /* ============ CARDS ============ */
      .card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 1.25rem;
        transition: all 0.2s ease;
      }
      .card:hover {
        border-color: var(--color-accent);
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      }

      /* ============ INPUTS ============ */
      .input {
        background: var(--bg-surface2);
        border: 1px solid var(--border-color);
        border-radius: 0.875rem;
        color: var(--text-primary);
        transition: all 0.15s ease;
      }
      .input:focus {
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-accent-soft);
        outline: none;
      }
      .input::placeholder { color: var(--text-muted); }

      /* ============ SCROLLBAR ============ */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-accent); }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* ============ DIVIDER ============ */
      .divider { height: 1px; background: linear-gradient(to right, transparent, var(--border-color), transparent); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",

  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
